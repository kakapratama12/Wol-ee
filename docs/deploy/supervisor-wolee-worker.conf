; Supervisor config untuk Wol-ee queue worker (produksi).
; Salin ke /etc/supervisor/conf.d/wolee-worker.conf lalu:
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start wolee-worker:*
; Setelah tiap deploy: php artisan queue:restart

[program:wolee-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/wol-ee/artisan queue:work --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/wol-ee
autostart=true
autorestart=true
stopwaitsecs=3600
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/wol-ee/storage/logs/worker.log
stopasgroup=true
killasgroup=true
